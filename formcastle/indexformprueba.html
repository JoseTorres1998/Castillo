<!DOCTYPE HTML>
<html lang="es">
<head>
    <title>Formulario</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="icon" type="image/x-icon" href="Favicon.jpg">
    <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
</head>
<body class="form-background">
    <div id="page-wrapper">

        <!-- Header -->
        <div id="header">
            <div class="inner">
                <header>
                    <a href="index.html" id="index" title="inicio"></a>
                    <hr/>
                </header>
                <footer>  
                <h1>Visitanos</h1>
                </footer>
                 
            </div>

            <!-- Nav -->
            <nav id="nav">
                <div class="nav-container">
                    <ul>
                        <li><a href="../index.html"><i class="fas fa-home"></i> Inicio</a></li>
                    </ul>
                </div>    
            </nav>
        </div>

        <!-- Contenido principal -->
        <div class="background">
    <div class="form-container">
        <form id="visitaForm">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required>
            <div id="nombreError" class="error"></div>

            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
            <div id="telefonoError" class="error"></div>

            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div id="emailError" class="error"></div>

            <label for="fecha">Fecha y Hora de Visita:</label>
            <input type="text" id="fechaDisplay" readonly placeholder="Selecciona una fecha y hora">
            <div id="calendarioContainer" style="display: none;">
                <div id="calendarioHeader">
                    <button type="button" id="prevMonth">&larr;</button>
                    <span id="mesAnio"></span>
                    <button type="button" id="nextMonth">&rarr;</button>
                </div>
                <div id="calendarioDias">
                    <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
                </div>
                <div id="calendarioFechas"></div>
                <div id="horaSelector">
                    <label>Hora:</label>
                    <select id="horaSelect">
                        <option value="10:00">10:00</option>
                        <option value="10:00">10:30</option>
                        <option value="11:00">11:00</option>
                        <option value="11:00">11:30</option>
                        <option value="12:00">12:00</option>
                        <option value="12:00">12:30</option>
                    </select>
                    <button type="button" id="confirmarFecha">Confirmar</button>
                </div>
            </div>
            <div id="fechaError" class="error"></div>

            <button type="submit" class="form-button">Enviar Solicitud</button>
        </form>
    </div>
</div>

<script>
    const fechaDisplay = document.getElementById('fechaDisplay');
    const calendarioContainer = document.getElementById('calendarioContainer');
    const calendarioFechas = document.getElementById('calendarioFechas');
    const mesAnio = document.getElementById('mesAnio');
    const prevMonth = document.getElementById('prevMonth');
    const nextMonth = document.getElementById('nextMonth');
    const horaSelect = document.getElementById('horaSelect');
    const confirmarFecha = document.getElementById('confirmarFecha');
    const form = document.getElementById('visitaForm');
    const fechaError = document.getElementById('fechaError');

    let currentDate = new Date();
    let selectedDate = null;

    // Mostrar el calendario al hacer clic en el input
    fechaDisplay.addEventListener('click', () => {
        calendarioContainer.style.display = 'block';
        mostrarCalendario(currentDate);
    });

    // Cambiar mes anterior
    prevMonth.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        mostrarCalendario(currentDate);
    });

    // Cambiar mes siguiente
    nextMonth.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        mostrarCalendario(currentDate);
    });

    // Confirmar selección de fecha y hora
    confirmarFecha.addEventListener('click', () => {
        if (selectedDate) {
            const hora = horaSelect.value;
            const fechaStr = selectedDate.toLocaleDateString('es-ES', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            fechaDisplay.value = `${fechaStr}, ${hora}`;
            calendarioContainer.style.display = 'none';
        }
    });

    // Mostrar el calendario
    function mostrarCalendario(date) {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        // Ajustar el primer día (0 = Domingo, queremos Lunes = 0)
        const firstDayAdjusted = firstDay === 0 ? 6 : firstDay - 1;

        // Mostrar mes y año
        mesAnio.textContent = date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

        // Generar los días
        let html = '';
        for (let i = 0; i < firstDayAdjusted; i++) {
            html += '<div></div>'; // Espacios vacíos
        }

        for (let day = 1; day <= lastDate; day++) {
            const tempDate = new Date(year, month, day);
            const dayOfWeek = tempDate.getDay();
            const isWeekend = dayOfWeek === 0 || dayOfWeek === 6; // Domingo o Sábado
            const isToday = tempDate.toDateString() === new Date().toDateString();
            const isSelected = selectedDate && tempDate.toDateString() === selectedDate.toDateString();

            if (isWeekend) {
                html += `<div class="dia ${isToday ? 'hoy' : ''} ${isSelected ? 'seleccionado' : ''}" data-day="${day}">${day}</div>`;
            } else {
                html += `<div class="dia deshabilitado">${day}</div>`;
            }
        }

        calendarioFechas.innerHTML = html;

        // Agregar eventos a los días seleccionables
        document.querySelectorAll('.dia:not(.deshabilitado)').forEach(dia => {
            dia.addEventListener('click', () => {
                selectedDate = new Date(year, month, parseInt(dia.dataset.day));
                mostrarCalendario(currentDate); // Refrescar para mostrar selección
            });
        });
    }

    // Validar al enviar el formulario
    form.addEventListener('submit', (event) => {
        if (!fechaDisplay.value) {
            event.preventDefault();
            fechaError.textContent = 'Por favor, selecciona una fecha y hora.';
        } else {
            fechaError.textContent = '';
            console.log('Formulario enviado:', fechaDisplay.value);
        }
    });
</script>

<style>
    .error {
        color: red;
        font-size: 0.9em;
    }
    #fechaDisplay {
        padding: 5px;
        width: 100%;
        cursor: pointer;
    }
    #calendarioContainer {
        border: 1px solid #ccc;
        padding: 10px;
        background: white;
        position: absolute;
        z-index: 1000;
    }
    #calendarioHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
    }
    #calendarioDias {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
        font-weight: bold;
    }
    #calendarioFechas {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
    }
    .dia {
        padding: 5px;
        cursor: pointer;
    }
    .dia.deshabilitado {
        color: #ccc;
        cursor: not-allowed;
    }
    .dia.hoy {
        background: #e0e0e0;
    }
    .dia.seleccionado {
        background: #007bff;
        color: white;
    }
    #horaSelector {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #confirmarFecha {
        padding: 5px 10px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
    }
</style>

        <div id="footer">
            <!-- Logos -->
            <div class="footer-logos">
                <img src="../logosfooter/footer-high.png" alt="Logosfooter" class="logo-responsive" />
                <img src="../logosfooter/footer-mob.png" alt="Logosfooter mobile" class="logo-mobile" />
            </div>

            <!-- Redes Sociales -->
            <div class="social-icons">

                    <li><a href="#" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
                    <li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
                </ul>
            </div>

            <!-- Copyright -->
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="copyright">
                            <ul class="menu">
                                <li>&copy; Programa de Empleo y Formación de La Guardia de Jaén. Exp. 23/2023/PE/0001</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/jquery.dropotron.min.js"></script>
    <script src="../assets/js/jquery.scrolly.min.js"></script>
    <script src="../assets/js/jquery.scrollex.min.js"></script>
    <script src="../assets/js/browser.min.js"></script>
    <script src="../assets/js/breakpoints.min.js"></script>
    <script src="../assets/js/util.js"></script>
    <script src="../assets/js/main.js"></script>

</body>
