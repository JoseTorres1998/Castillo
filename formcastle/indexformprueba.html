<!DOCTYPE HTML>
<html lang="es">
<head>
    <title>Formulario</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="icon" type="image/x-icon" href="Favicon.jpg">
    <noscript><link rel="stylesheet" href="../assets/css/noscript.css" /></noscript>
</head>
<body class="form-background">
    <div id="page-wrapper">

        <!-- Header -->
        <div id="header">
            <div class="inner">
                <header>
                    <a href="index.html" id="index" title="inicio"></a>
                    <hr/>
                </header>
                <footer>  
                <h1>Visitanos</h1>
                </footer>
                 
            </div>

            <!-- Nav -->
            <nav id="nav">
                <div class="nav-container">
                    <ul>
                        <li><a href="../index.html"><i class="fas fa-home"></i> Inicio</a></li>
                        <li><a href="../formcastle/indexformprueba.html"><i class="fas fa-map-signs"></i>     Visítanos</a></li>
				        <li><a href="../contacto.html"><i class="fas fa-phone-alt"></i>     Contacto</a></li>
                    </ul>
                </div>    
            </nav>
        </div>

        <!-- Contenido principal -->
        <div class="background">
            <div class="form-container">
                <form id="visitaForm">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <div id="nombreError" class="error"></div>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" required>
                    <div id="telefonoError" class="error"></div>

                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required>
                    <div id="emailError" class="error"></div>

                    <label for="fecha">Fecha y Hora de Visita:</label>
                    <input type="datetime-local" id="fecha" name="fecha" required>

                    <button type="submit" class="form-button">Enviar Solicitud</button>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer">
            <!-- Logos -->
            <div class="footer-logos">
                <img src="../logosfooter/footer-high.png" alt="Logosfooter" class="logo-responsive" />
                <img src="../logosfooter/footer-mob.png" alt="Logosfooter mobile" class="logo-mobile" />
            </div>

            <!-- Redes Sociales -->
            <div class="social-icons">
                <ul class="icons">
                    <li><a href="#" class="icon brands fa-facebook-f"><span class="label">Facebook</span></a></li>
                    <li><a href="#" class="icon brands fa-instagram"><span class="label">Instagram</span></a></li>
                </ul>
            </div>

            <!-- Copyright -->
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="copyright">
                            <ul class="menu">
                                <li>&copy; Programa de Empleo y Formación de La Guardia de Jaén. Exp. 23/2023/PE/0001</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/jquery.dropotron.min.js"></script>
    <script src="../assets/js/jquery.scrolly.min.js"></script>
    <script src="../assets/js/jquery.scrollex.min.js"></script>
    <script src="../assets/js/browser.min.js"></script>
    <script src="../assets/js/breakpoints.min.js"></script>
    <script src="../assets/js/util.js"></script>
    <script src="../assets/js/main.js"></script>

</body>
</html>
